# 临时调试用:在 macOS 上裸跑 test_udpSocketBufferConfig 30 次(对照 master 的 3/30 段错误),
# 并跑 test_pollerDeferredDelete 5 次。定位完成后删除本文件,不要合入。
name: DebugDeferred
on: [push]
jobs:
  build:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v2
    - name: 配置 vcpkg
      uses: lukka/run-vcpkg@v7
      with:
        vcpkgDirectory: '${{github.workspace}}/vcpkg'
        vcpkgTriplet: arm64-osx
        vcpkgGitCommitId: 'efcfaaf60d7ec57a159fc3110403d939bfb69729'
        vcpkgArguments: 'openssl'
    - name: 安装指定 CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.30.5'
    - name: 编译
      uses: lukka/run-cmake@v3
      with:
        useVcpkgToolchainFile: true
        buildDirectory: '${{github.workspace}}/build'
        cmakeAppendedArgs: ''
        cmakeBuildType: 'RelWithDebInfo'
    - name: 裸跑统计
      working-directory: '${{github.workspace}}/build'
      run: |
        set +e
        U=$(find . -name test_udpSocketBufferConfig -type f -perm +111 | head -1)
        D=$(find . -name test_pollerDeferredDelete -type f -perm +111 | head -1)
        fail=0; for i in $(seq 1 30); do "$U" > /dev/null 2>&1; rc=$?; [ $rc -ne 0 ] && { fail=$((fail+1)); echo "udpSocket 第 $i 次 rc=$rc"; }; done
        echo "===== test_udpSocketBufferConfig 裸跑 30 次,失败 $fail 次 (master 基线 3/30) ====="
        dfail=0; for i in 1 2 3 4 5; do "$D" 2>&1 | grep "deferred delete"; rc=$?; "$D" > /dev/null 2>&1 || dfail=$((dfail+1)); done
        echo "===== test_pollerDeferredDelete 5 次,失败 $dfail 次 ====="
        exit 0
